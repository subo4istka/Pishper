name: Build Windows executable

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify imports
        run: python tools/diagnostics/check_imports.py

      - name: Build
        run: pyinstaller Pishper.spec --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pishper-exe
          path: dist/Pishper.exe

# The artifact is deliberately NOT attached to the release.  A green build only
# proves PyInstaller finished, not that the .exe starts — a bundle with corrupted
# DLLs builds cleanly and then dies on LoadLibrary, and nothing here would catch
# it.  Release binaries are built and actually launched on a real desktop first
# — see CONTRIBUTING.md.
